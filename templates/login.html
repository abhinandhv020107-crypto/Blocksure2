<!doctype html><html><head><title>Login | BlockSure</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="auth"><section class="auth-left"><a class="brand" href="home.html"><span class="logo"><i class="fa-solid fa-cubes"></i></span>BlockSure</a><div><span class="badge">Secure Access</span><h1>One platform.<br><span class="gradient">Verified trust.</span></h1><p style="margin-top:18px;color:#cbd5e1">Access the dashboard for your assigned role.</p></div><p style="color:var(--muted)">Blockchain-based product authentication.</p></section><section class="auth-right"><form class="card auth-card" method="post"><h2>Welcome back</h2><p style="margin:8px 0 24px">Enter your details to continue.</p><div class="group"><label>Email</label><input class="input" name="email" type="email" required></div><div class="group" style="margin-top:15px"><label>Password</label><input class="input" name="password" type="password" required></div><div class="group" style="margin-top:15px"><label>Role</label><select name="role" required><option value="">Choose role</option><option>Admin</option><option>Manufacturer</option><option>Seller</option><option>Customer</option></select></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Sign In</button></form></section></div><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
