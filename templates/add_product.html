<!doctype html><html><head><title>Add Product | BlockSure</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="dashboard"><aside class="sidebar"><a class="brand" href="{{ url_for('auth.home') }}"><span class="logo"><i class="fa-solid fa-cubes"></i></span>BlockSure</a><div class="menu"><a class="" href="{{ url_for('manufacturer.dashboard') }}"><i class="fa-solid fa-chart-line"></i>Dashboard</a><a class="active" href="{{ url_for('manufacturer.add_product') }}"><i class="fa-solid fa-circle-plus"></i>Add Product</a><a class="" href="{{ url_for('customer.product_details') }}"><i class="fa-solid fa-boxes-stacked"></i>My Products</a><a class="" href="{{ url_for('customer.blockchain_history') }}"><i class="fa-solid fa-link"></i>History</a><a href="{{ url_for('auth.logout') }}"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></div></aside><main class="main"><header class="topbar"><div class="page-title"><h1>Add Product</h1><p>Secure BlockSure workspace</p></div><div class="profile"><div class="avatar">BS</div><div><b>Manufacturer</b><small style="display:block;color:var(--muted)">Verified account</small></div></div></header><section class="card form"><h2 style="font-family:Space Grotesk;margin-bottom:8px">Register a Product</h2><p style="margin-bottom:24px">Create the product identity and first blockchain transaction.</p><form class="form-grid" method="post" action="{{ url_for('manufacturer.add_product') }}"><div class="group"><label>Product Name</label><input class="input" name="product_name" required></div><div class="group"><label>Brand</label><input class="input" name="brand" required></div><div class="group"><label>Batch Number</label><input class="input" name="batch_number" required></div><div class="group"><label>Category</label><select name="category"><option>Electronics</option><option>Fashion</option><option>Medicine</option><option>Food</option></select></div><div class="group"><label>Manufacturing Date</label><input class="input" name="manufacturing_date" type="date" required></div><div class="group"><label>Expiry Date</label><input class="input" name="expiry_date" type="date"></div><div class="group"><label>Price</label><input class="input" name="price" type="number" step="0.01" required></div><div class="group"><label>Location</label><input class="input" name="location" required></div><div class="group full"><label>Description</label><textarea name="description" rows="4"></textarea></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('manufacturer.dashboard') }}">Cancel</a><button class="btn btn-primary">Add Product & Generate QR</button></div></form></section></main></div><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
